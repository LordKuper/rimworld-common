# commands.yaml — machine-only SSoT for project build/test/run commands
# read by Backend Dev, Test Engineer, and review agents
#
# .NET Framework (net472) RimWorld mod library. Building requires the
# RimWorldManagedDir env var / MSBuild property pointing at RimWorld's Managed dir.

test: "dotnet test Source\\LordKuper.Common.Tests\\LordKuper.Common.Tests.csproj"
lint: "dotnet format Source\\LordKuper.Common.slnx --verify-no-changes --severity warn"
build: "dotnet build Source\\LordKuper.Common.slnx -c Release"
run: ""

custom:
  # JetBrains ReSharper CLI (jetbrains.resharper.globaltools, command `jb`).
  # Run jb-cleanup before build; run jb-inspect after lint and verify the sarif has no error/warning.
  jb-cleanup:       "jb cleanupcode Source\\LordKuper.Common.slnx"
  jb-inspect:       "jb inspectcode Source\\LordKuper.Common.slnx -o=\".\\TestResults\\jb-inspect.sarif\" --build"

  # Coverage for LordKuper.Common via AltCover (altcover.global tool required; RIMWORLD_DIR must be set).
  # Measures only the LordKuper.Common assembly, excluding UI + game-bound types (Resources, *WeaponStats,
  # ToolStats, CommonMod, Compatibility.Vse, Logger, PawnHelper, PassionHelper) from the denominator —
  # these require a live RimWorld game context and are not unit-testable without a full harness.
  # Prints "Visited Points N of M (P%)" — P is the AltCover line-coverage proxy.
  # Sprint-002 acceptance floor: >=37.2% (baseline 38.2% minus 1.0pp); measured 41.08% at sprint cut.
  coverage:         "powershell -ExecutionPolicy Bypass -File scripts\\coverage.ps1"

  # @google/design.md tooling (Windows pattern; run from project root).
  # Run designmd-install once per session before first lint/diff/export.
  designmd-install: "npm install @google/design.md"
  designmd-lint:    "node_modules\\.bin\\design.md.cmd lint design\\ux\\DESIGN.md"
  designmd-diff:    "node_modules\\.bin\\design.md.cmd diff"
  designmd-export:  "node_modules\\.bin\\design.md.cmd export --format json-tailwind design\\ux\\DESIGN.md"
